# Remove or update to a real existing JDK 17 path. Leaving it commented so Gradle/Flutter can auto-detect a valid JDK.
# Example valid paths (adjust to your machine):
#   C:\\Program Files\\Java\\jdk-17.0.11
#   C:\\Program Files\\Android\\Android Studio\\jbr
# To restore, uncomment and set correctly.
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

